spring:
  config:
    activate:
      on-profile: test
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  health:
    rabbit:
      enabled: false
  opentelemetry:
    tracing:
      sampler: always-off
  # No local OTLP receiver: cached test contexts would log a failed push every
  # 60 s into whichever test is running. Export tests enable it explicitly.
  otlp:
    metrics:
      export:
        enabled: false

flowpay:
  metrics:
    sampling:
      enabled: false
  webhook:
    delivery-worker:
      enabled: false
    secret:
      encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  messaging:
    webhook-consumer:
      enabled: false
    ledger-consumer:
      enabled: false
    outbox:
      relay:
        enabled: false
  security:
    prometheus-public: false
    jwt:
      generate-ephemeral-key-pair: true
    refresh-cookie:
      cookie-secure: false
