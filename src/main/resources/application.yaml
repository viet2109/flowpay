spring:
  application:
    name: flowpay-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

flowpay:
  idempotency:
    retention: ${IDEMPOTENCY_RETENTION:24h}
    cleanup:
      enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:true}
      batch-size: ${IDEMPOTENCY_CLEANUP_BATCH_SIZE:100}
      max-batches-per-run: ${IDEMPOTENCY_CLEANUP_MAX_BATCHES_PER_RUN:10}
      initial-delay: ${IDEMPOTENCY_CLEANUP_INITIAL_DELAY:15m}
      fixed-delay: ${IDEMPOTENCY_CLEANUP_FIXED_DELAY:15m}
  payment:
    provider: ${PAYMENT_PROVIDER:simulator}
    simulator:
      default-outcome: ${PAYMENT_SIMULATOR_DEFAULT_OUTCOME:SUCCESS}
  security:
    prometheus-public: false
    jwt:
      issuer: https://flowpay.dev
      access-token-ttl: 15m
      generate-ephemeral-key-pair: false
    refresh-token:
      ttl: 7d
    refresh-cookie:
      cookie-secure: true
