spring:
  application:
    name: flowpay-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}
    template:
      mandatory: ${RABBITMQ_TEMPLATE_MANDATORY:true}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.1

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [requestId=%X{requestId:-}] %logger{36} - %msg%n"

flowpay:
  messaging:
    topology:
      exchange: ${RABBITMQ_EVENT_EXCHANGE:flowpay.events}
      ledger-queue: ${RABBITMQ_LEDGER_QUEUE:flowpay.ledger.events}
      dead-letter-exchange: ${RABBITMQ_DEAD_LETTER_EXCHANGE:flowpay.events.dlx}
      ledger-dead-letter-queue: ${RABBITMQ_LEDGER_DLQ:flowpay.ledger.events.dlq}
      dead-letter-routing-key: ${RABBITMQ_LEDGER_DEAD_ROUTING_KEY:ledger.dead}
      webhook-queue: ${RABBITMQ_WEBHOOK_QUEUE:flowpay.webhook.events}
      webhook-dead-letter-queue: ${RABBITMQ_WEBHOOK_DLQ:flowpay.webhook.events.dlq}
      webhook-dead-letter-routing-key: ${RABBITMQ_WEBHOOK_DEAD_ROUTING_KEY:webhook.dead}
    webhook-consumer:
      enabled: ${WEBHOOK_EVENT_CONSUMER_ENABLED:true}
      retry:
        max-attempts: ${WEBHOOK_EVENT_CONSUMER_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${WEBHOOK_EVENT_CONSUMER_RETRY_INITIAL_INTERVAL:500ms}
        multiplier: ${WEBHOOK_EVENT_CONSUMER_RETRY_MULTIPLIER:2.0}
        max-interval: ${WEBHOOK_EVENT_CONSUMER_RETRY_MAX_INTERVAL:5s}
    ledger-consumer:
      enabled: ${LEDGER_EVENT_CONSUMER_ENABLED:true}
      retry:
        max-attempts: ${LEDGER_EVENT_CONSUMER_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${LEDGER_EVENT_CONSUMER_RETRY_INITIAL_INTERVAL:500ms}
        multiplier: ${LEDGER_EVENT_CONSUMER_RETRY_MULTIPLIER:2.0}
        max-interval: ${LEDGER_EVENT_CONSUMER_RETRY_MAX_INTERVAL:5s}
    outbox:
      publisher-confirm-timeout: ${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT:5s}
      relay:
        enabled: ${OUTBOX_RELAY_ENABLED:true}
        fixed-delay: ${OUTBOX_RELAY_FIXED_DELAY:1s}
        batch-size: ${OUTBOX_RELAY_BATCH_SIZE:100}
        initial-backoff: ${OUTBOX_RELAY_INITIAL_BACKOFF:1s}
        max-backoff: ${OUTBOX_RELAY_MAX_BACKOFF:60s}
  idempotency:
    retention: ${IDEMPOTENCY_RETENTION:24h}
    cleanup:
      enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:true}
      batch-size: ${IDEMPOTENCY_CLEANUP_BATCH_SIZE:100}
      max-batches-per-run: ${IDEMPOTENCY_CLEANUP_MAX_BATCHES_PER_RUN:10}
      initial-delay: ${IDEMPOTENCY_CLEANUP_INITIAL_DELAY:15m}
      fixed-delay: ${IDEMPOTENCY_CLEANUP_FIXED_DELAY:15m}
  payment:
    provider: ${PAYMENT_PROVIDER:simulator}
    simulator:
      default-outcome: ${PAYMENT_SIMULATOR_DEFAULT_OUTCOME:SUCCESS}
  refund:
    provider: ${REFUND_PROVIDER:simulator}
    simulator:
      default-outcome: ${REFUND_SIMULATOR_DEFAULT_OUTCOME:SUCCESS}
  webhook:
    delivery-worker:
      enabled: ${WEBHOOK_DELIVERY_WORKER_ENABLED:true}
      fixed-delay: ${WEBHOOK_DELIVERY_WORKER_FIXED_DELAY:1s}
      batch-size: ${WEBHOOK_DELIVERY_WORKER_BATCH_SIZE:100}
      lease-timeout: ${WEBHOOK_DELIVERY_WORKER_LEASE_TIMEOUT:30s}
    delivery:
      retry-delays: ${WEBHOOK_DELIVERY_RETRY_DELAYS:10s,30s,2m,10m,1h}
      retry-jitter-max: ${WEBHOOK_DELIVERY_RETRY_JITTER_MAX:0.20}
    http:
      connect-timeout: ${WEBHOOK_HTTP_CONNECT_TIMEOUT:2s}
      request-timeout: ${WEBHOOK_HTTP_REQUEST_TIMEOUT:5s}
    secret:
      encryption-key: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
    url-policy:
      allow-insecure-localhost: ${WEBHOOK_ALLOW_INSECURE_LOCALHOST:false}
  security:
    prometheus-public: false
    jwt:
      issuer: https://flowpay.dev
      access-token-ttl: 15m
      generate-ephemeral-key-pair: false
    refresh-token:
      ttl: 7d
    refresh-cookie:
      cookie-secure: true
