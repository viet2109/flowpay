spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowpay}
    username: ${DB_USERNAME:flowpay}
    password: ${DB_PASSWORD:flowpay}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:flowpay}
    password: ${RABBITMQ_PASSWORD:flowpay}

management:
  opentelemetry:
    tracing:
      sampler: ${TRACING_SAMPLER:always-off}

flowpay:
  # Amounts ending in 901/902/903 (minor units) force DECLINED/UNKNOWN/TECHNICAL_FAILURE
  # in the simulators, so every outcome is reachable without a restart.
  payment:
    simulator:
      amount-triggers-enabled: ${PAYMENT_SIMULATOR_AMOUNT_TRIGGERS_ENABLED:true}
  refund:
    simulator:
      amount-triggers-enabled: ${REFUND_SIMULATOR_AMOUNT_TRIGGERS_ENABLED:true}
  security:
    prometheus-public: true
    jwt:
      generate-ephemeral-key-pair: true
    refresh-cookie:
      cookie-secure: false
