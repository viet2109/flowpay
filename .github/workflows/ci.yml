name: CI

on:
  push:
    branches: [main, 'feature/phase-*']
  pull_request:
  workflow_dispatch:

# No deployment, registry, PR mutation, SARIF upload or OIDC credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MAVEN_ARGS: ''
      MAVEN_OPTS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
          verify-signature: true
          # No shared PR-writable Maven or scanner database cache.
      - name: Gate regression tests
        run: python3 -B -m unittest discover -s ops/ci/tests -v
      - name: Clean verification with mandatory infrastructure coverage
        run: python3 -B ops/ci/gate.py verify
      - name: Build exact verified JAR into a pinned non-root image
        id: image
        run: python3 -B ops/container/image.py build
      - name: Isolated production image restart and API to Ledger Webhook gates
        run: python3 -B ops/container/image.py runtime
      - name: Image inventory, secrets and OS Java vulnerability gate
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: python3 -B ops/container/image.py scan
      - name: Safe verification evidence only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-safe/verification.json
            target/ci-safe/image-build.json
            target/ci-safe/image-runtime.json
            target/ci-safe/image-scan.json
            target/ci-safe/image-sbom.cdx.json
          if-no-files-found: error
          retention-days: 7

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAVEN_ARGS: ''
      MAVEN_OPTS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
          verify-signature: true
      - name: Offline negative fixtures and live dependency, SAST and secret gates
        run: python3 -B ops/ci/gate.py security
      - name: Safe security evidence and dependency inventory only
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/ci-safe/security.json
            target/ci-safe/sbom.cdx.json
          if-no-files-found: error
          retention-days: 7
