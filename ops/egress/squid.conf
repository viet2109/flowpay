# P8-T09 enforcing CONNECT policy. No TLS interception, hostname rewriting or peers.
# The proxy is operator-trusted and reachable only on the private application network.
visible_hostname flowpay-webhook-egress
http_port 3128
acl CONNECT method CONNECT
# Conservative public-unicast policy: mirrors WebhookDestinationAddressPolicy.
# dst checks every cached A/AAAA address; a single blocked answer denies the tunnel.
acl blocked dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl blocked dst 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3
# Squid stores IPv4 as ::ffff:0:0/96 internally. Exclude that slice from ::/3,
# or a broad IPv6 prefix will overlap/drop IPv4 rules in its ACL splay tree.
acl blocked-v6 dst ::-::fffe:ffff:ffff ::1:0:0:0-1fff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
acl blocked-v6 dst 4000::/2 8000::/1 2001::/23 2001:db8::/32 2002::/16 3fff::/20
http_access deny !CONNECT
http_access deny blocked
http_access deny blocked-v6
http_access allow CONNECT
http_access deny all
# No URL/body/header/access logs, no disk cache or forward upstream proxy.
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
connect_timeout 2 seconds
dns_timeout 3 seconds
dns_retransmit_interval 1 seconds
request_timeout 5 seconds
read_timeout 10 seconds
shutdown_lifetime 1 seconds
