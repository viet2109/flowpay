global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yaml]
scrape_configs:
  - job_name: flowpay
    metrics_path: /actuator/prometheus
    # Discover each replica once over IPv4; do not double-count A + AAAA.
    dns_sd_configs:
      - names: [app]
        type: A
        port: 9091
        refresh_interval: 15s
  - job_name: rabbitmq
    static_configs: [{targets: ['rabbitmq:15692']}]
  - job_name: rabbitmq-queues
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics, queue_consumer_count]
      vhost: ['/']
      queue: ['^flowpay\.(ledger|webhook)\.events(\.dlq)?$']
    static_configs: [{targets: ['rabbitmq:15692']}]
    metric_relabel_configs:
      - source_labels: [queue]
        regex: 'flowpay\.(ledger|webhook)\.events(\.dlq)?'
        action: keep
  - job_name: collector
    static_configs: [{targets: ['collector:8888']}]
  - job_name: tempo
    static_configs: [{targets: ['tempo:3200']}]
  - job_name: prometheus
    static_configs: [{targets: ['localhost:9090']}]
