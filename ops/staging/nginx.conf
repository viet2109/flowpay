# Same P8-T10 route/rate/forwarding contract; T13 adds TLS and bounded Docker DNS.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/null crit;
events { worker_connections 512; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 10s;
    client_body_timeout 10s;
    keepalive_timeout 10s;
    send_timeout 30s;
    map $request_method $auth_ip { default ""; POST $binary_remote_addr; }
    map $request_method $mutation_ip {
        default ""; POST $binary_remote_addr; PUT $binary_remote_addr;
        PATCH $binary_remote_addr; DELETE $binary_remote_addr;
    }
    limit_req_zone $auth_ip zone=flowpay_auth:10m rate=10r/m;
    limit_req_zone $mutation_ip zone=flowpay_mutations:10m rate=10r/s;
    limit_req_status 429;
    upstream flowpay {
        zone flowpay 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        server app:8080 resolve;
    }
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl ipv6only=on;
        ssl_certificate /run/secrets/edge-cert.pem;
        ssl_certificate_key /run/secrets/edge-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;
        add_header Strict-Transport-Security "max-age=86400" always;
        add_header X-Request-Id $request_id always;
        location ^~ /api/v1/auth/ {
            limit_req zone=flowpay_auth burst=5 nodelay;
            error_page 429 = @auth_limited;
            include /etc/flowpay/proxy.conf;
        }
        location /api/v1/ {
            limit_req zone=flowpay_mutations burst=20 nodelay;
            error_page 429 = @mutation_limited;
            include /etc/flowpay/proxy.conf;
        }
        location = /livez { include /etc/flowpay/proxy.conf; }
        location = /readyz { include /etc/flowpay/proxy.conf; }
        location / { return 404; }
        location @auth_limited {
            default_type application/problem+json;
            add_header Strict-Transport-Security "max-age=86400" always;
            add_header X-Request-Id $request_id always;
            add_header Retry-After 60 always;
            return 429 '{"type":"https://flowpay.dev/problems/rate-limit-exceeded","title":"Rate limit exceeded","status":429,"detail":"The request rate limit was exceeded.","instance":"/api/v1/auth","code":"RATE_LIMIT_EXCEEDED","requestId":"$request_id"}';
        }
        location @mutation_limited {
            default_type application/problem+json;
            add_header Strict-Transport-Security "max-age=86400" always;
            add_header X-Request-Id $request_id always;
            add_header Retry-After 1 always;
            return 429 '{"type":"https://flowpay.dev/problems/rate-limit-exceeded","title":"Rate limit exceeded","status":429,"detail":"The request rate limit was exceeded.","instance":"/api/v1","code":"RATE_LIMIT_EXCEEDED","requestId":"$request_id"}';
        }
    }
}
