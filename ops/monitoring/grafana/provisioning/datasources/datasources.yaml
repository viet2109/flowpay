apiVersion: 1
prune: true
datasources:
  - name: FlowPay Prometheus
    uid: flowpay-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
  - name: FlowPay Tempo
    uid: flowpay-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
