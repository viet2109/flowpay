      ],
      "alert_rule_test": [
        {
          "eval_time": "8m",
          "alertname": "FlowPayMetricsStale",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "flowpay",
                "instance": "app:9091",
                "component": "OUTBOX",
                "severity": "warning"
              },
              "exp_annotations": {
                "summary": "Durable metrics are stale, missing or never sampled",
                "runbook": "docs/monitoring-runbook.md#metrics-stale"
              }
            }
          ]
        },
        {
          "eval_time": "20m",
          "alertname": "FlowPayMetricsStale",
          "exp_alerts": []
        }
      ]
    },
