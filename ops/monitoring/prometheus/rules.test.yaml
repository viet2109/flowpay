# JSON is a YAML subset; generated cases are reviewed and versioned, not regenerated at runtime.
{
  "rule_files": [
    "rules.yaml"
  ],
  "evaluation_interval": "1m",
  "group_eval_order": [
    "flowpay-shared-database",
    "flowpay-operational-alerts"
  ],
  "tests": [
    {
      "name": "FlowPayTargetUnavailable fires then resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "up{job=\"flowpay\",instance=\"app:9091\"}",
          "values": "0x9 1x11"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "8m",
          "alertname": "FlowPayTargetUnavailable",
          "exp_alerts": [
            {
              "exp_labels": {
                "job": "flowpay",
                "instance": "app:9091",
                "severity": "critical"
              },
              "exp_annotations": {
                "summary": "Required lab scrape target is unavailable",
                "runbook": "docs/monitoring-runbook.md#target-unavailable"
              }
            }
          ]
        },
        {
          "eval_time": "20m",
          "alertname": "FlowPayTargetUnavailable",
          "exp_alerts": []
        }
      ]
    },
    {
      "name": "FlowPayMetricsStale fires then resolves",
      "interval": "1m",
      "input_series": [
        {
          "series": "flowpay_metrics_sample_age_seconds{job=\"flowpay\",instance=\"app:9091\",component=\"OUTBOX\"}",
          "values": "180x9 0x11"
